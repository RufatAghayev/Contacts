<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F5F5; }

  .toolbar {
    background: #1976D2;
    padding: 48px 16px 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .toolbar h1 {
    color: #fff; font-size: 22px; font-weight: 700;
    text-align: center; margin-bottom: 10px;
  }
  .search-box {
    background: #2288E0;
    border-radius: 8px;
    display: flex; align-items: center;
    padding: 8px 12px; gap: 8px;
  }
  .search-box input {
    background: transparent; border: none; outline: none;
    color: #fff; font-size: 14px; width: 100%;
  }
  .search-box input::placeholder { color: #AACCFF; }
  .search-icon { color: rgba(255,255,255,0.8); font-size: 16px; }

  .contact-list { padding-bottom: 70px; }

  .section-label {
    background: #EEEEEE;
    padding: 8px 16px;
    font-size: 12px; font-weight: 700;
    color: #212121; letter-spacing: 0.5px;
  }

  .contact-item {
    background: #fff;
    display: flex; align-items: center;
    padding: 12px 16px; gap: 12px;
    border-bottom: 0.5px solid #F0F0F0;
    cursor: pointer;
    text-decoration: none;
  }
  .contact-item:active { background: #F5F5F5; }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }

  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    font-size: 15px; font-weight: 700; color: #212121;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-phone { font-size: 13px; color: #757575; margin-top: 2px; }

  .call-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: #E8F5E9;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; text-decoration: none;
  }
  .call-btn svg { width: 18px; height: 18px; fill: #1B5E20; }

  /* DETAIL EKRAN */
  .detail-screen {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #fff; z-index: 200;
    flex-direction: column;
  }
  .detail-screen.active { display: flex; }

  .detail-top {
    background: #fff;
    padding: 48px 16px 24px;
    display: flex; flex-direction: column; align-items: center;
  }
  .back-btn {
    align-self: flex-start;
    font-size: 26px; font-weight: 700; color: #212121;
    cursor: pointer; margin-bottom: 16px;
    background: none; border: none;
  }
  .detail-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; color: #fff;
    margin-bottom: 16px;
  }
  .detail-name { font-size: 22px; font-weight: 700; color: #212121; margin-bottom: 6px; }
  .detail-phone-text { font-size: 15px; color: #757575; }

  .divider { height: 1px; background: #EEEEEE; }

  .action-btns {
    display: flex; justify-content: space-around;
    padding: 20px 16px; background: #fff;
  }
  .action-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; cursor: pointer; text-decoration: none;
    border: none; background: none;
  }
  .action-icon {
    width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .action-icon svg { width: 24px; height: 24px; }
  .action-icon.call { background: #C8E6C9; }
  .action-icon.call svg { fill: #1B5E20; }
  .action-icon.whatsapp { background: #C8E6C9; }
  .action-icon.whatsapp svg { fill: #1B5E20; }
  .action-icon.sms { background: #BBDEFB; }
  .action-icon.sms svg { fill: #0D47A1; }
  .action-label { font-size: 12px; font-weight: 700; color: #555; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; height: 60px;
    display: flex; border-top: 1px solid #EEEEEE;
    z-index: 100;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; border: none; background: none;
  }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item span { font-size: 11px; font-weight: 700; }
  .nav-item.active svg { fill: #1976D2; }
  .nav-item.active span { color: #1976D2; }
  .nav-item:not(.active) svg { fill: #999; }
  .nav-item:not(.active) span { color: #999; }

  .empty-msg {
    text-align: center; padding: 40px 16px;
    color: #999; font-size: 15px;
  }
</style>
</head>

  const parts = name.trim().split(' ');
  if (parts.length === 1) return parts[0][0].toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function renderContacts(data) {
  const list = document.getElementById('contactList');
  if (!data.length) {
    list.innerHTML = '<div class="empty-msg">Heç bir kontakt tapılmadı</div>';
    return;
  }
  let html = '';
  data.forEach(group => {
    html += `<div class="section-label">${group.region.toUpperCase()}</div>`;
    group.users.forEach((user, i) => {
      const color = COLORS[i % COLORS.length];
      const isFav = favorites.includes(user.phone);
      html += `
        <div class="contact-item" onclick="openDetail('${user.name}','${user.phone}','${color}')">
          <div class="avatar" style="background:${color}">${getInitials(user.name)}</div>
          <div class="contact-info">
            <div class="contact-name">${user.name}</div>
            <div class="contact-phone">${user.phone}</div>
          </div>
          <span onclick="event.stopPropagation();toggleFav('${user.phone}',this)" style="font-size:22px;cursor:pointer;margin-right:8px">${isFav?'⭐':'☆'}</span>
          <a class="call-btn" href="tel:${user.phone}" onclick="event.stopPropagation()">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/></svg>
          </a>
        </div>`;
    });
  });
  list.innerHTML = html;
}

function toggleFav(phone, el) {
  if (favorites.includes(phone)) {
    favorites = favorites.filter(f => f !== phone);
    el.textContent = '☆';
  } else {
    favorites.push(phone);
    el.textContent = '⭐';
  }
  localStorage.setItem('favs', JSON.stringify(favorites));
}

function filterContacts() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) { renderContacts(contacts); return; }
  const result = [];
  contacts.forEach(group => {
    if (group.region.toLowerCase().includes(q)) {
      result.push(group);
    } else {
      const matched = group.users.filter(u =>
        u.name.toLowerCase().includes(q) || u.phone.includes(q)
      );
      if (matched.length) result.push({region: group.region, users: matched});
    }
  });
  renderContacts(result);
}

function showContacts() {
  currentTab = 'contacts';
  document.getElementById('navContacts').classList.add('active');
  document.getElementById('navFavs').classList.remove('active');
  document.getElementById('searchInput').value = '';
  renderContacts(contacts);
}

function showFavorites() {
  currentTab = 'favs';
  document.getElementById('navFavs').classList.add('active');
  document.getElementById('navContacts').classList.remove('active');
  const result = [];
  contacts.forEach(group => {
    const matched = group.users.filter(u => favorites.includes(u.phone));
    if (matched.length) result.push({region: group.region, users: matched});
  });
  renderContacts(result);
}

function openDetail(name, phone, color) {
  document.getElementById('detailAvatar').textContent = getInitials(name);
  document.getElementById('detailAvatar').style.background = color;
  document.getElementById('detailName').textContent = name;
  document.getElementById('detailPhoneText').textContent = phone;
  document.getElementById('detailCall').href = 'tel:' + phone;
  let num = phone.replace(/[^0-9]/g,'');
  if (!num.startsWith('994')) num = '994' + num;
  document.getElementById('detailWhatsapp').href = 'https://wa.me/' + num;
  document.getElementById('detailSms').href = 'sms:' + phone;
  document.getElementById('detailScreen').classList.add('active');
}

function closeDetail() {
  document.getElementById('detailScreen').classList.remove('active');
}

renderContacts(contacts);
</script>
</body>
</html>
